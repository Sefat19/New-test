<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Download Site</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f9f9f9;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
        }
        .search-bar {
            text-align: center;
            margin: 20px;
        }
        .search-bar input {
            width: 60%;
            padding: 10px;
            font-size: 16px;
        }
        .search-bar button {
            padding: 10px 20px;
            font-size: 16px;
        }
        .section-title {
            margin: 20px;
            font-size: 24px;
        }
        .featured, .latest {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            width: calc(25% - 20px);
            box-shadow: 2px 2px 8px rgba(0,0,0,0.05);
        }
        .card img {
            max-width: 100%;
            height: auto;
        }
        .card button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
        }
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .card {
                width: 100%;
            }
            .search-bar input {
                width: 80%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MyDownloadSite</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Categories</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class
